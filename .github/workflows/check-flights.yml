name: Check flight prices

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Only send a test message to the ntfy topic"
        type: boolean
        default: false

concurrency:
  group: check-flights
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # state.json remembers which flights were already alerted. It's kept in the
      # Actions cache: restore the newest one, then save a new copy after the run.
      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: state
          key: flight-state-${{ github.run_id }}
          restore-keys: flight-state-

      - name: Send test notification
        if: ${{ inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m flight_checker --test-notification

      - name: Check prices
        if: ${{ !inputs.test_notification }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m flight_checker

      - name: Save alert history
        if: ${{ always() && !inputs.test_notification }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: flight-state-${{ github.run_id }}
