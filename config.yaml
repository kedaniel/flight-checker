# Flight price alerts — edit this file to set what to watch.
#
# Secrets (NOT in this file): TRAVELPAYOUTS_TOKEN, NTFY_TOPIC, optional NTFY_TOKEN.

currency: EGP                     # prices and max_price are in this currency
# Travelpayouts keeps separate price data per market (roughly: which country's site
# people searched on). Several are combined for better coverage.
markets: [us, ru]
skyscanner_domain: www.skyscanner.net   # where alert links open

# Same trip from each departure city. A flight counts if it leaves any day in
# December 2026 and returns 5–8 nights later; direct and connecting flights both count.
searches:
  - name: Cairo → Istanbul
    origin: CAI          # Cairo International
    destination: IST     # Istanbul city code: covers both IST and Sabiha Gökçen (SAW)
    month: 2026-12
    max_price: 12000     # per person, return, in EGP
    trip: return
    nights: [5, 8]
    direct_only: false
    adults: 1

  - name: Giza → Istanbul
    origin: SPX          # Sphinx International (Giza)
    destination: IST
    month: 2026-12
    max_price: 12000
    trip: return
    nights: [5, 8]
    direct_only: false
    adults: 1

  - name: Alexandria → Istanbul
    origin: HBE          # Borg El Arab (Alexandria)
    destination: IST
    month: 2026-12
    max_price: 12000
    trip: return
    nights: [5, 8]
    direct_only: false
    adults: 1

verification:
  enabled: true              # re-check matches on Google Flights before alerting
  max_checks_per_search: 8   # Google lookups per search per run
  delay_seconds: 3           # pause between Google lookups
  on_error: send             # if Google can't be checked: send (marked unverified) or skip

notify:
  server: https://ntfy.sh
  max_deals_per_message: 5
  renotify_drop_pct: 10      # re-alert a flight already sent only if it's 10%+ cheaper
  high_priority_ratio: 0.75  # high-priority alert if cheapest ≤ 75% of max_price
